# Evita que Supabase pause el proyecto gratuito por inactividad (7 días).
# Hace una consulta ligera a la API REST cada 3 días. Con RLS, la respuesta
# puede venir vacía; basta con que la petición llegue a la base de datos.
name: Supabase keepalive

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar la API REST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Faltan los secrets SUPABASE_URL o SUPABASE_ANON_KEY" >&2
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/pantallas?select=clave&limit=1" \
            -o /dev/null -w "HTTP %{http_code}\n"
